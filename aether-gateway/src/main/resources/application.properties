spring.application.name=gateway

# Spring Data JPA & PostgreSQL Config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aether_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aether_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secure_password_123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Aether Engine TCP Connection Pool Config
aether.engine.host=${AETHER_ENGINE_HOST:localhost}
aether.engine.port=${AETHER_ENGINE_PORT:8080}
# Full cluster node list (host:port,host:port,...) used as failover seeds
# when the current leader becomes unreachable. Empty = single-node setup.
aether.engine.nodes=${AETHER_ENGINE_NODES:}
aether.pool.size=20

# JWT Token Settings
aether.jwt.secret=9a76a98f12b67fcd56784534a6ef2fcd2e1a3b4c5d6e7f8a9b0c1d2e3f4a5b6c
aether.jwt.expiration-ms=86400000

# Redis Config
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
