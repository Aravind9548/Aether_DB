// COPY of aether-engine/proto/client.proto — keep these two files in sync
// manually. Duplicated rather than shared via a restructured Docker build
// context (see Phase B plan's scoping decision #2).
syntax = "proto3";
package aether.client;

// Java codegen only (ignored by the C++ side) - explicit rather than relying
// on protoc's default outer-class-name derivation from the filename.
option java_package = "aether.client";
option java_multiple_files = true;

// Client data-path RPCs (SET/GET/DEL) between the gateway and the engine.
// STATUS and the raw-TCP diagnostic protocol are intentionally NOT part of
// this service — see the Phase B plan's scoping decision #1.

message SetRequest {
  string key = 1;
  string val = 2;
}
message SetResponse {
  bool ok = 1;
  bool not_leader = 2;
  string leader_hint = 3;
  string error = 4;
  // Dashboard visibility (Cluster Console) - shard the key hashed to, and how
  // many of the cluster's nodes had replicated this write by the time it
  // committed. -1/-1 in standalone mode (no replication to report).
  int32 shard_id = 5;
  int32 replicated_count = 6;
  int32 cluster_size = 7;
}

message GetRequest {
  string key = 1;
}
message GetResponse {
  bool found = 1;
  string val = 2;
  bool not_leader = 3;
  string leader_hint = 4;
  int32 shard_id = 5;
  // "TIMEOUT" when the node could not confirm it is still the leader in
  // time (ReadIndex) - e.g. it is cut off from the majority. Not found is
  // found=false with an empty error.
  string error = 6;
}

message DeleteRequest {
  string key = 1;
}
message DeleteResponse {
  bool deleted = 1;
  bool not_leader = 2;
  string leader_hint = 3;
  string error = 4;
  int32 shard_id = 5;
  int32 replicated_count = 6;
  int32 cluster_size = 7;
}

service AetherClient {
  rpc Set(SetRequest) returns (SetResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}
