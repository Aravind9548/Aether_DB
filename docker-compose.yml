version: '3.8'

# AetherDB 3-node Raft cluster. Text protocol (SET/GET/DEL/STATUS) on 8080,
# client gRPC (SET/GET/DEL, used by the gateway) on 10080 (client port + 2000),
# Raft peer gRPC on 9080 (client port + 1000) - all internal to the mesh
# network only.
x-engine-common: &engine-common
  build:
    context: ./aether-engine
    dockerfile: Dockerfile
  networks:
    - aether-mesh
  restart: always

services:
  aether-engine-1:
    <<: *engine-common
    environment:
      - AETHER_NODE_ID=1
      - AETHER_PEERS=2=aether-engine-2:8080,3=aether-engine-3:8080
    volumes:
      - aether_data_1:/data

  aether-engine-2:
    <<: *engine-common
    environment:
      - AETHER_NODE_ID=2
      - AETHER_PEERS=1=aether-engine-1:8080,3=aether-engine-3:8080
    volumes:
      - aether_data_2:/data

  aether-engine-3:
    <<: *engine-common
    environment:
      - AETHER_NODE_ID=3
      - AETHER_PEERS=1=aether-engine-1:8080,2=aether-engine-2:8080
    volumes:
      - aether_data_3:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aether_auth
      POSTGRES_USER: aether_admin
      POSTGRES_PASSWORD: secure_password_123
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - aether-mesh
    restart: always

  redis:
    image: redis:7-alpine
    networks:
      - aether-mesh
    restart: always

  api-gateway:
    build:
      context: ./aether-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Publicly exposed API Gateway
    environment:
      - AETHER_ENGINE_HOST=aether-engine-1
      - AETHER_ENGINE_PORT=10080
      - AETHER_ENGINE_NODES=aether-engine-1:10080,aether-engine-2:10080,aether-engine-3:10080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aether_auth
      - SPRING_DATASOURCE_USERNAME=aether_admin
      - SPRING_DATASOURCE_PASSWORD=secure_password_123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - aether-engine-1
      - aether-engine-2
      - aether-engine-3
      - postgres
      - redis
    networks:
      - aether-mesh
    restart: always

networks:
  aether-mesh:
    driver: bridge

volumes:
  aether_data_1:
  aether_data_2:
  aether_data_3:
  pg_data:
