version: '3.8'

# AetherDB 3-node Raft cluster. Text protocol (SET/GET/DEL/STATUS) on 8080,
# client gRPC (SET/GET/DEL, used by the gateway) on 10080 (client port + 2000),
# Raft peer gRPC on 9080 (client port + 1000) - all internal to the mesh
# network only.
x-engine-common: &engine-common
  build:
    context: ./aether-engine
    dockerfile: Dockerfile
  networks:
    - aether-mesh
  restart: always
  # Without this, AetherDB runs as PID 1 of the container's own PID
  # namespace - and a process that is PID 1 of its namespace is immune to
  # signals it sends itself (including SIGKILL), a documented Linux kernel
  # behavior (the exact reason Docker ships this flag). That immunity is
  # what silently no-op'd the Cluster Console's "Kill Leader" self-kill RPC
  # (KillSelf) - `docker kill` from the host still worked fine since that
  # delivers the signal from outside the container's namespace. `init: true`
  # runs Docker's built-in minimal init (docker-init/tini) as PID 1 instead,
  # so AetherDB is an ordinary child process and self-SIGKILL works normally.
  init: true

services:
  aether-engine-1:
    <<: *engine-common
    environment:
      - AETHER_NODE_ID=1
      - AETHER_PEERS=2=aether-engine-2:8080,3=aether-engine-3:8080
      # Chaos-testing hooks only (chaos_suite.py). Empty/unset by default -
      # inert unless explicitly exported on the host before `docker compose up`.
      - AETHER_CHAOS_SNAPSHOT_DELAY_MS=${AETHER_CHAOS_SNAPSHOT_DELAY_MS:-}
      - AETHER_CHAOS_DELAY_PEER_ID=${AETHER_CHAOS_DELAY_PEER_ID:-}
      - AETHER_CHAOS_DELAY_MS=${AETHER_CHAOS_DELAY_MS:-}
    volumes:
      - aether_data_1:/data

  aether-engine-2:
    <<: *engine-common
    environment:
      - AETHER_NODE_ID=2
      - AETHER_PEERS=1=aether-engine-1:8080,3=aether-engine-3:8080
      - AETHER_CHAOS_SNAPSHOT_DELAY_MS=${AETHER_CHAOS_SNAPSHOT_DELAY_MS:-}
      - AETHER_CHAOS_DELAY_PEER_ID=${AETHER_CHAOS_DELAY_PEER_ID:-}
      - AETHER_CHAOS_DELAY_MS=${AETHER_CHAOS_DELAY_MS:-}
    volumes:
      - aether_data_2:/data

  aether-engine-3:
    <<: *engine-common
    environment:
      - AETHER_NODE_ID=3
      - AETHER_PEERS=1=aether-engine-1:8080,2=aether-engine-2:8080
      - AETHER_CHAOS_SNAPSHOT_DELAY_MS=${AETHER_CHAOS_SNAPSHOT_DELAY_MS:-}
      - AETHER_CHAOS_DELAY_PEER_ID=${AETHER_CHAOS_DELAY_PEER_ID:-}
      - AETHER_CHAOS_DELAY_MS=${AETHER_CHAOS_DELAY_MS:-}
    volumes:
      - aether_data_3:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aether_auth
      POSTGRES_USER: aether_admin
      POSTGRES_PASSWORD: secure_password_123
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - aether-mesh
    restart: always

  redis:
    image: redis:7-alpine
    networks:
      - aether-mesh
    restart: always

  api-gateway:
    build:
      context: ./aether-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Publicly exposed API Gateway
    environment:
      - AETHER_ENGINE_HOST=aether-engine-1
      - AETHER_ENGINE_PORT=10080
      - AETHER_ENGINE_NODES=aether-engine-1:10080,aether-engine-2:10080,aether-engine-3:10080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/aether_auth
      - SPRING_DATASOURCE_USERNAME=aether_admin
      - SPRING_DATASOURCE_PASSWORD=secure_password_123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # Read from a local .env file (gitignored) - never hardcode real
      # credentials here. Falls back to the app's own placeholder default
      # if .env doesn't set them, so the stack still runs without them.
      # Required - compose refuses to start the stack without it.
      - AETHER_JWT_SECRET=${AETHER_JWT_SECRET:?set AETHER_JWT_SECRET in .env (openssl rand -hex 32)}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-placeholder-client-secret}
    depends_on:
      - aether-engine-1
      - aether-engine-2
      - aether-engine-3
      - postgres
      - redis
    networks:
      - aether-mesh
    restart: always

networks:
  aether-mesh:
    driver: bridge

volumes:
  aether_data_1:
  aether_data_2:
  aether_data_3:
  pg_data:
