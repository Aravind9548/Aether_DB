syntax = "proto3";
package aether.raft;

// Mirrors WalRecord (Persistence.hpp): a single replicated log entry.
message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  string op = 3;   // "S", "D", or "N" (no-op)
  string key = 4;
  string val = 5;
}

message RequestVoteRequest {
  uint64 term = 1;
  int32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  // PreVote (Raft thesis §9.6): a probe round that asks "would you vote for
  // me at term+1?" without anyone changing state. A node cut off by a
  // partition never wins one, so its term never inflates while isolated and
  // it cannot depose a healthy leader when the partition heals.
  bool pre_vote = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  uint64 leader_commit = 5;
  repeated LogEntry entries = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message KeyValuePair {
  string key = 1;
  string val = 2;
}

// Sent instead of AppendEntries when a follower needs entries the leader has
// already compacted into its snapshot. Carries the whole state machine at
// last_included_index (single message - fine at this project's data sizes;
// the receive limit is raised accordingly in RaftNode::start()).
message InstallSnapshotRequest {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  repeated KeyValuePair data = 5;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  uint64 last_included_index = 2;
}

service RaftPeer {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}
